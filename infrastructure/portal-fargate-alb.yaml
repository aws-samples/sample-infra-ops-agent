AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infrastructure Provisioning Portal — ECS Fargate behind a public ALB.
  Runs the self-contained portal (Strands agent + UI) on the stock python:3.11
  image, bootstrapping app.py from S3 at container start. Fully self-contained;
  provisions real EC2 instances via the task IAM role.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the ALB and Fargate service
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB and Fargate tasks (2+ AZs)
  CodeBucket:
    Type: String
    Description: S3 bucket holding app.py and requirements.txt
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
  CertificateArn:
    Type: String
    Description: >
      ACM certificate ARN for the HTTPS listener (TLS termination on the ALB).
      Required — the portal is served over HTTPS only. Request or import a
      certificate in AWS Certificate Manager for your portal domain first.
  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      CIDR permitted to reach the portal over HTTPS. Defaults to the internet;
      scope this to your corporate/VPN ranges for a real deployment (M5/M7).

Resources:

  # ─── Security Groups ───
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Portal ALB - allow HTTPS (and HTTP for redirect) from the allowed CIDR
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # H2: HTTPS is the served protocol.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
        # Port 80 exists only to 301-redirect callers to HTTPS.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidr
      Tags:
        - Key: Name
          Value: infra-agent-portal-alb-sg

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Portal Fargate service - allow from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: infra-agent-portal-svc-sg

  # SG for the EC2 instances the agent provisions
  ProvisionedInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Instances provisioned by the Infrastructure Agent
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: infra-agent-provisioned-sg

  # ─── IAM Roles ───
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: S3AndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub 'arn:aws:s3:::${CodeBucket}'
                  - !Sub 'arn:aws:s3:::${CodeBucket}/*'

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PortalRuntimePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Bedrock model invocation
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: '*'
              # Read app code from S3
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub 'arn:aws:s3:::${CodeBucket}'
                  - !Sub 'arn:aws:s3:::${CodeBucket}/*'
              # SSM parameter for AMI lookup
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: arn:aws:ssm:*::parameter/aws/service/*
              # EC2 describe + tag
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeImages
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:CreateTags
                Resource: '*'
              # EC2 provisioning — restricted to t3.micro/t3.small at IAM level
              - Effect: Allow
                Action: ec2:RunInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Effect: Deny
                Action: ec2:RunInstances
                Resource: arn:aws:ec2:*:*:instance/*
                Condition:
                  StringNotEquals:
                    ec2:InstanceType: [t3.micro, t3.small]

  # ─── CloudWatch Logs ───
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /ecs/infra-agent-portal
      RetentionInDays: 30

  # ─── ECS Cluster + Task + Service ───
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: infra-agent-portal

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: infra-agent-portal
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: portal
          Image: public.ecr.aws/docker/library/python:3.11-slim
          Essential: true
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: CODE_BUCKET
              Value: !Ref CodeBucket
            - Name: PROVISION_SUBNET_ID
              Value: !Select [0, !Ref SubnetIds]
            - Name: PROVISION_SG_ID
              Value: !Ref ProvisionedInstanceSG
          # Bootstrap: fetch app.py + requirements from S3, install deps, run uvicorn
          EntryPoint: [/bin/sh, -c]
          Command:
            - !Sub >
              pip install --no-cache-dir awscli >/dev/null 2>&1 &&
              aws s3 cp s3://${CodeBucket}/app.py /app/app.py &&
              aws s3 cp s3://${CodeBucket}/requirements.txt /app/requirements.txt &&
              pip install --no-cache-dir -r /app/requirements.txt &&
              cd /app &&
              uvicorn app:app --host 0.0.0.0 --port 8000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: portal

  # ─── WAF (H5) ───
  # AWS WAFv2 WebACL fronting the ALB: AWS managed rule groups (common threats +
  # known-bad inputs) plus a rate-based rule (M7) to throttle abusive callers.
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: infra-agent-portal-waf
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: infra-agent-portal-waf
      Rules:
        - Name: AWSCommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: common-rule-set
        - Name: AWSKnownBadInputs
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: known-bad-inputs
        # M7: rate limiting — block source IPs exceeding 500 requests / 5 min.
        - Name: RateLimit
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 500
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit

  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebACL.Arn

  # ─── ALB ───
  # H2: the ALB terminates TLS (HTTPS listener below); port 80 only redirects to
  # HTTPS. drop_invalid_header_fields is enabled to strip malformed headers.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_91
            comment: "Access logging to S3 recommended; enable for your environment."
    Properties:
      Name: infra-agent-portal-alb
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref ALBSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: infra-agent-portal-tg
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  # H2: HTTPS listener terminating TLS 1.3/1.2 with the ACM certificate.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # H2: port 80 exists only to 301-redirect every request to HTTPS. No plaintext
  # traffic is ever forwarded to the service.
  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: infra-agent-portal
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 600
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: portal
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  PortalURL:
    Description: Public URL of the Infrastructure Provisioning Portal (HTTPS)
    Value: !Sub 'https://${LoadBalancer.DNSName}'
  WebACLArn:
    Description: WAFv2 WebACL protecting the portal ALB
    Value: !GetAtt WebACL.Arn
  ClusterName:
    Value: !Ref Cluster
  LogGroup:
    Value: !Ref LogGroup
